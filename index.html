<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIQUE AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
}
header {
  padding: 20px;
  background: #192235;
  font-size: 23px;
  font-weight: bold;
}
#chat {
  padding: 18px;
  height: calc(100vh - 150px);
  overflow-y: auto;
}
.msg {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.5;
  max-width: 90%;
}
.user { background: #2855a5; margin-left: auto; }
.ai { background: #263247; }
.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 12px;
  background: #192235;
  gap: 8px;
}
input {
  flex: 1;
  padding: 14px;
  border-radius: 25px;
  border: 0;
  font-size: 16px;
}
button {
  border: 0;
  border-radius: 25px;
  padding: 12px 18px;
  background: #3978ef;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>
<header>🤖 UNIQUE AI</header>
<div id="chat">
  <div class="msg ai">
    வணக்கம்! UNIQUE AI-க்கு வரவேற்கிறேன்.
    உங்களுக்கு என்ன உதவி வேண்டும்?
  </div>
</div>
<div class="bottom">
  <input id="message" placeholder="Ask anything...">
  <button onclick="sendMessage()">➤</button>
</div>
<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const msg = input.value.trim();
  if (!msg) return;

  const user = document.createElement("div");
  user.className = "msg user";
  user.textContent = msg;
  chat.appendChild(user);

  const ai = document.createElement("div");
  ai.className = "msg ai";
  ai.textContent = "AI connection விரைவில் இணைக்கப்படும்!";
  chat.appendChild(ai);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
